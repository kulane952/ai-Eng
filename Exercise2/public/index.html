<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Art Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090b;
      color: white;
    }

    .container {
      width: min(1200px, 92%);
      margin: auto;
      padding: 70px 0;
    }

    .hero {
      text-align: center;
      margin-bottom: 60px;
    }

    .hero h1 {
      font-size: 56px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #a1a1aa;
      font-size: 18px;
    }

    .generator {
      max-width: 700px;
      margin: auto;
      background: #18181b;
      padding: 25px;
      border-radius: 20px;
      border: 1px solid #27272a;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: none;

      background: #09090b;
      color: white;

      border: 1px solid #3f3f46;
      border-radius: 12px;

      padding: 15px;
      font-size: 16px;

      outline: none;
    }

    textarea:focus {
      border-color: white;
    }

    button {
      width: 100%;
      margin-top: 15px;

      padding: 15px;

      border: none;
      border-radius: 12px;

      background: white;
      color: black;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 25px;
      color: #a1a1aa;
    }

    .gallery {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));

      gap: 25px;

      margin-top: 60px;
    }

    .card {
      background: #18181b;

      border: 1px solid #27272a;

      border-radius: 18px;

      overflow: hidden;
    }

    .card img {
      width: 100%;
      display: block;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .card-content {
      padding: 18px;
    }

    .card h2 {
      margin: 0;
    }

    .empty {
      text-align: center;
      color: #71717a;
      margin-top: 50px;
    }

    @media(max-width: 600px) {
      .hero h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="hero">

      <h1>AI Art Gallery</h1>

      <p>
        Turn your imagination into beautiful AI artwork.
      </p>

    </section>

    <section class="generator">

      <label for="theme">
        What should we create?
      </label>

      <textarea
        id="theme"
        placeholder="Example: A futuristic city in Somalia..."
      ></textarea>

      <button id="generateBtn">
        ✨ Generate Artwork
      </button>

      <div
        class="loading"
        id="loading"
      >
        🎨 Creating your artworks...
        Please wait.
      </div>

    </section>

    <section
      id="gallery"
      class="gallery"
    ></section>

    <div
      id="empty"
      class="empty"
    >
      Your generated artwork will appear here.
    </div>

  </main>

  <script>

    const themeInput =
      document.getElementById("theme");

    const generateBtn =
      document.getElementById("generateBtn");

    const gallery =
      document.getElementById("gallery");

    const loading =
      document.getElementById("loading");

    const empty =
      document.getElementById("empty");


    generateBtn.addEventListener(
      "click",
      async () => {

        const theme =
          themeInput.value.trim();

        if (!theme) {
          alert("Please enter a theme.");
          return;
        }

        generateBtn.disabled = true;

        loading.style.display = "block";

        gallery.innerHTML = "";

        empty.style.display = "none";

        try {

          const response =
            await fetch("/api/generate", {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                theme
              })

            });

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.error ||
              "Generation failed"
            );
          }

          data.images.forEach(
            (image) => {

              const card =
                document.createElement(
                  "article"
                );

              card.className = "card";

              card.innerHTML = `
                <img
                  src="${image.url}"
                  alt="${image.title}"
                />

                <div class="card-content">
                  <h2>
                    ${image.title}
                  </h2>
                </div>
              `;

              gallery.appendChild(card);

            }
          );

        } catch (error) {

          alert(error.message);

        } finally {

          generateBtn.disabled = false;

          loading.style.display = "none";

        }

      }
    );

  </script>

</body>
</html>
